───────────────────────────────────────── */
const useScaleToFit = (w, h) => {
const [scale, setScale] = React.useState(1);
React.useEffect(() => {
const calc = () => {
const sw = window.innerWidth / (w + 60);
const sh = window.innerHeight / (h + 60);
setScale(Math.min(sw, sh, 1));
};
calc();
window.addEventListener('resize', calc);
return () => window.removeEventListener('resize', calc);
}, [w, h]);
return scale;
};

function PillBtn({ children, onClick, variant = 'filled', disabled, style = {} }) {
const base = {
fontFamily: SANS, fontWeight: 600, fontSize: 15,
letterSpacing: '-0.005em',
padding: '18px 28px',
borderRadius: 999,
border: variant === 'outline' ? `1.5px solid ${D.ink}` : 'none',
background: variant === 'outline' ? 'transparent' : D.ink,
color: variant === 'outline' ? D.ink : D.black,
cursor: disabled ? 'not-allowed' : 'pointer',
display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 8,
transition: `transform 0.15s ease, opacity 0.15s ease`,
opacity: disabled ? 0.3 : 1,
width: '100%',
...style,
};
return (
<button
onClick={disabled ? undefined : onClick}
style={base}
onMouseEnter={e => { if (!disabled) e.currentTarget.style.transform = 'translateY(-1px)'; }}
onMouseLeave={e => { e.currentTarget.style.transform = 'translateY(0)'; }}
>
{children}
</button>
);
}

/* ─────────────────────────────────────────
ROOT APP
───────────────────────────────────────── */
function App() {
const [screen, setScreen] = React.useState('congrats');
const [teamName, setTeamName] = React.useState(() =>
TEAM_NAMES[Math.floor(Math.random() * TEAM_NAMES.length)]
);
const [chosenMood, setChosenMood] = React.useState(null);


const scale = useScaleToFit(768, 1024);


const goTo = (s) => setScreen(s);


const handleReset = () => {
setChosenMood(null);
setTeamName(TEAM_NAMES[Math.floor(Math.random() * TEAM_NAMES.length)]);
setScreen('congrats');
};


const renderScreen = () => {
switch (screen) {
case 'congrats':
return <CongratsScreen teamName={teamName} onContinue={() => goTo('selfie')} />;
case 'selfie':
return <SelfieScreen onContinue={() => goTo('artfacts')} />;
case 'artfacts':
return <ArtFactsScreen onContinue={() => goTo('comparison')} />;
case 'comparison':
return <ComparisonScreen teamName={teamName} onContinue={() => goTo('topworks')} />;
case 'topworks':
return <TopWorksScreen onContinue={() => goTo('moods')} />;
case 'moods':
return <MoodsScreen onContinue={() => goTo('moodpick')} />;
case 'moodpick':
return <MoodPickScreen onSelect={(id) => { setChosenMood(id); goTo('moodboard'); }} />;
case 'moodboard':
return <MoodboardScreen chosenMood={chosenMood} onReset={handleReset} />;
default:
return null;
}
};


return (
<div style={{
transform: `scale(${scale})`,
transformOrigin: 'center center',
}}>
<div className="tablet-shell">
<div className="tablet-screen">
{renderScreen()}
</div>
</div>
</div>
);
}


ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
