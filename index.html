const useScaleToFit = (w, h) => {
  const [scale, setScale] = React.useState(1);
  React.useEffect(() => {
    const calc = () => {
      const sw = window.innerWidth / (w + 60);
      const sh = window.innerHeight / (h + 60);
      setScale(Math.min(sw, sh, 1));
    };
    calc();
    window.addEventListener('resize', calc);
    return () => window.removeEventListener('resize', calc);
  }, [w, h]);
  return scale;
};

  return (
    <div style={{ display: 'inline-flex', alignItems: 'baseline', gap: 4 }}>

      }}>play</span>
    </div>
  );
}

function Topbar({ label }) {
  // Parse "recap 01 / 08" → current=1, total=8
  const match = label && label.match(/(\d+)\s*\/\s*(\d+)/);
  const current = match ? parseInt(match[1], 10) : 1;
  const total   = match ? parseInt(match[2], 10) : 8;

  return (
    <div style={{
      display: 'flex', alignItems: 'center', justifyContent: 'space-between',
      padding: '16px 32px',
      borderBottom: `1px solid ${D.ink4}`,
      flexShrink: 0,
    }}>
      {/* SAM inverted logo */}
      <img
        src="sam-logo-inverted.png"
        alt="SAM"
        style={{ height: 18, objectFit: 'contain', display: 'block' }}
      />

      {/* Dot-based progress indicator */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 5 }}>
        {Array.from({ length: total }, (_, i) => {
          const active = i + 1 === current;
          return (
            <div key={i} style={{
              height: 7,
              width: active ? 20 : 7,
              borderRadius: 999,
              background: active ? D.vermillion : D.ink4,
              transition: 'width 0.3s ease, background 0.3s ease',
              flexShrink: 0,
            }} />
          );
        })}
      </div>
    </div>
  );
}

function MonoLabel({ children, dim, style = {} }) {
  return (
    <span style={{
      fontFamily: MONO, fontSize: 11, fontWeight: 400,
      letterSpacing: '0.1em', textTransform: 'uppercase',
      color: dim ? D.ink3 : D.ink2,
      ...style,
    }}>{children}</span>
  );
}

function PillBtn({ children, onClick, variant = 'filled', disabled, style = {} }) {
  const base = {
    fontFamily: SANS, fontWeight: 600, fontSize: 15,
    letterSpacing: '-0.005em',
    padding: '18px 28px',
    borderRadius: 999,
    border: variant === 'outline' ? `1.5px solid ${D.ink}` : 'none',
    background: variant === 'outline' ? 'transparent' : D.ink,
    color: variant === 'outline' ? D.ink : D.black,
    cursor: disabled ? 'not-allowed' : 'pointer',
    display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 8,
    transition: `transform 0.15s ease, opacity 0.15s ease`,
    opacity: disabled ? 0.3 : 1,
    width: '100%',
    ...style,
  };
  return (
    <button
      onClick={disabled ? undefined : onClick}
      style={base}
      onMouseEnter={e => { if (!disabled) e.currentTarget.style.transform = 'translateY(-1px)'; }}
      onMouseLeave={e => { e.currentTarget.style.transform = 'translateY(0)'; }}
    >
      {children}
    </button>
  );
}

function NavRow({ onBack, onNext, nextLabel = 'next →' }) {
  return (
    <div style={{ display: 'flex', gap: 12 }}>

          fontFamily: SANS, fontWeight: 600, fontSize: 15,
          padding: '18px 24px', borderRadius: 999,
          border: `1.5px solid ${D.ink3}`, background: 'transparent',
          color: D.ink2, cursor: 'pointer', flexShrink: 0,
          transition: 'border-color 0.15s, color 0.15s',

        onMouseEnter={e => { e.currentTarget.style.color = D.ink; e.currentTarget.style.borderColor = D.ink; }}
        onMouseLeave={e => { e.currentTarget.style.color = D.ink2; e.currentTarget.style.borderColor = D.ink3; }}

      {onNext && (
        <button onClick={onNext} style={{
          fontFamily: SANS, fontWeight: 600, fontSize: 15,
          padding: '18px 28px', borderRadius: 999, border: 'none',
          background: D.ink, color: D.black, cursor: 'pointer', flex: 1,
          transition: 'transform 0.15s ease',
        }}
        onMouseEnter={e => e.currentTarget.style.transform = 'translateY(-1px)'}
        onMouseLeave={e => e.currentTarget.style.transform = 'translateY(0)'}

      )}
    </div>
  );
}

function ArtPlaceholder({ label, title, tint = D.alt, height = 220, style = {} }) {
  const stripeColor = tint === D.alt ? 'rgba(255,255,255,0.04)' : 'rgba(255,255,255,0.06)';
  return (
    <div style={{
      background: tint,
      backgroundImage: `repeating-linear-gradient(
        45deg,
        ${stripeColor},
        ${stripeColor} 1px,
        transparent 1px,
        transparent 14px
      )`,
      borderRadius: 12, height,
      display: 'flex', flexDirection: 'column',
      alignItems: 'center', justifyContent: 'center',
      gap: 8, overflow: 'hidden', position: 'relative',
      ...style,
    }}>
      <span style={{ fontSize: 28, opacity: 0.5 }}>🖼</span>
      {label && (
        <MonoLabel dim style={{ textAlign: 'center', padding: '0 12px' }}>{label}</MonoLabel>
      )}
      {title && (
        <div style={{
          fontFamily: SERIF, fontStyle: 'italic', fontSize: 13,
          color: D.ink3, textAlign: 'center', padding: '0 14px', lineHeight: 1.3,
        }}>{title}</div>
      )}
    </div>
  );
}

function RealImage({ src, alt, style, fallbackLabel }) {
  const [err, setErr] = React.useState(false);
  if (err) return <ArtPlaceholder label={fallbackLabel} style={style} />;
  return <img src={src} alt={alt} onError={() => setErr(true)} style={{ objectFit: 'cover', objectPosition: 'top center', ...style }} />;
}

function Sticker({ children, rot = -3, color = D.blush, textColor = D.ink }) {
  return (
    <div style={{
      display: 'inline-block',
      background: color,
      color: textColor,
      fontFamily: MONO, fontSize: 10, fontWeight: 500,
      letterSpacing: '0.06em', textTransform: 'uppercase',
      padding: '5px 10px', borderRadius: 8,
      transform: `rotate(${rot}deg)`,
      flexShrink: 0,
    }}>{children}</div>
  );
}

/* Screen fade-in wrapper */
function ScreenFade({ children, style = {} }) {
  const [vis, setVis] = React.useState(false);
  React.useEffect(() => { const t = setTimeout(() => setVis(true), 40); return () => clearTimeout(t); }, []);
  return (
    <div style={{
      width: '100%', height: '100%',
      opacity: vis ? 1 : 0,
      transition: 'opacity 0.4s ease',
      display: 'flex', flexDirection: 'column',
      ...style,
    }}>
      {children}
    </div>
  );
}

/* ─────────────────────────────────────────
   MATCH BAR — animated count-up + grow
───────────────────────────────────────── */
function MatchBar({ finalPct, stickerText, stickerRot = -4 }) {
  const [pct, setPct] = React.useState(0);

  React.useEffect(() => {
    let raf;
    const delay = setTimeout(() => {
      const duration = 1400;
      const t0 = performance.now();
      const tick = (now) => {
        const prog = Math.min((now - t0) / duration, 1);
        const eased = 1 - Math.pow(1 - prog, 3); // ease-out cubic
        setPct(eased * finalPct);
        if (prog < 1) raf = requestAnimationFrame(tick);
        else setPct(finalPct); // snap to exact final value
      };
      raf = requestAnimationFrame(tick);
    }, 400);
    return () => { clearTimeout(delay); cancelAnimationFrame(raf); };
  }, [finalPct]);

  return (
    <div style={{
      marginTop: 20, background: D.surface, borderRadius: 14,
      padding: '16px 20px', position: 'relative',
    }}>
      <div style={{
        display: 'flex', justifyContent: 'space-between', alignItems: 'center',
        marginBottom: 10,
      }}>
        <MonoLabel dim style={{ fontSize: 12 }}>vibe match</MonoLabel>
        <span style={{
          fontFamily: SANS, fontWeight: 800, fontSize: 22,
          color: D.vermillion, letterSpacing: '-0.03em',
        }}>
          {Math.round(pct)}%
        </span>
      </div>
      <div style={{ height: 6, background: D.alt, borderRadius: 999, overflow: 'hidden' }}>
        <div style={{ height: '100%', width: `${pct}%`, background: D.vermillion, borderRadius: 999 }}/>
      </div>
      {stickerText && (
        <div style={{ position: 'absolute', top: -10, right: 18 }}>
          <Sticker rot={stickerRot} color={D.blush} textColor={D.ink}>{stickerText}</Sticker>
        </div>
      )}
    </div>
  );
}

function GeneratingScreen({ onDone }) {
  const [progress, setProgress] = React.useState(0);
  const [fadeOut,  setFadeOut]  = React.useState(false);
  const [phaseKey, setPhaseKey] = React.useState(0);

  const DURATION = 4800;

  const phaseMessages = [
    'scanning your memories...',
    'reading the room...',
    'assembling your board...',
    'your moodboard is ready',
  ];

  React.useEffect(() => {
    let raf;
    let start = null;
    let lastPhase = -1;
    const step = (ts) => {
      if (!start) start = ts;
      const p = Math.min((ts - start) / DURATION, 1);
      setProgress(p);
      const newPhase = Math.min(Math.floor(p * 4), 3);
      if (newPhase !== lastPhase) { lastPhase = newPhase; setPhaseKey(newPhase); }
      if (p < 1) { raf = requestAnimationFrame(step); }
      else { setTimeout(() => { setFadeOut(true); setTimeout(() => onDone(), 700); }, 300); }

          animation: `cardIn 0.9s cubic-bezier(0.34,1.56,0.64,1) ${card.delay}s both,

          zIndex: 3 + (i % 5),

        }}>
          <RealImage src={card.src} alt="" fallbackLabel=""
            style={{ width: '100%', height: '100%', borderRadius: 9 }} />

            position: 'absolute', inset: 0,
            background: `linear-gradient(180deg,transparent 0%,${D.vermillion}1E 50%,transparent 100%)`,

        position: 'absolute', left: 0, right: 0, height: 1,

      {/* Floating mood words */}
      {WORDS.map((word, i) => (

          pointerEvents: 'none', zIndex: 3,
        }}>{word}</div>
      ))}

      {/* Collage colour fragments */}
      {[
        { w:52, h:52, fx:'-80px', fy:'-60px', fr:'-18deg', left:'22%', top:'28%', bg:D.blush,    delay:'0.2s' },
        { w:38, h:38, fx:'70px',  fy:'-50px', fr:'22deg',  left:'68%', top:'32%', bg:D.vermillion,delay:'0.5s' },

      {/* Center card — glassmorphism so text reads over busy collage */}

  );
}

/* ─────────────────────────────────────────
   ROOT APP
───────────────────────────────────────── */
function App() {
  const [screen, setScreen] = React.useState('intro');
  const [history, setHistory] = React.useState([]);
  const [teamName, setTeamName] = React.useState(() =>
    TEAM_NAMES[Math.floor(Math.random() * TEAM_NAMES.length)]
  );
  const [chosenMood, setChosenMood] = React.useState(null);

  const scale = useScaleToFit(1194, 834);

  const goTo = (s) => { setHistory(prev => [...prev, screen]); setScreen(s); };
  const goBack = () => {
    const prev = history[history.length - 1];
    if (prev) { setHistory(h => h.slice(0, -1)); setScreen(prev); }
  };

  const handleReset = () => {
    setChosenMood(null);
    setTeamName(TEAM_NAMES[Math.floor(Math.random() * TEAM_NAMES.length)]);
    setHistory([]);
    setScreen('intro');
  };

  const renderScreen = () => {
    switch (screen) {
      case 'intro':
        return <IntroScreen onContinue={() => goTo('congrats')} />;
      case 'congrats':
        return <CongratsScreen onContinue={() => goTo('artfacts1')} />;
      case 'artfacts1':
        return <ArtFactScreen key="artfacts1" painting={ART_FACTS[0]} screenLabel="recap 01 / 08"
                 onContinue={() => goTo('artfacts2')} onBack={goBack} />;
      case 'artfacts2':
        return <ArtFactScreen key="artfacts2" painting={ART_FACTS[1]} screenLabel="recap 02 / 08"
                 onContinue={() => goTo('artfacts3')} onBack={goBack} />;
      case 'artfacts3':
        return <ArtFactScreen key="artfacts3" painting={ART_FACTS[2]} screenLabel="recap 03 / 08"
                 onContinue={() => goTo('comparison')} onBack={goBack} />;
      case 'comparison':
        return <ComparisonScreen teamName={teamName} onContinue={() => goTo('comparison2')} onBack={goBack} />;
      case 'comparison2':
        return <Comparison2Screen onContinue={() => goTo('topworks')} onBack={goBack} />;
      case 'topworks':
        return <TopWorksScreen
          onContinue={() => {
            // Auto-select dominant mood from session, push topworks to history
            setChosenMood(SESSION_MOODS[0].id);
            setHistory(prev => [...prev, 'topworks']);
            setScreen('generating');
          }}
          onBack={goBack}
        />;
      case 'generating':
        // One-way transition — onDone does NOT push to history so back from moodboard → topworks
        return <GeneratingScreen onDone={() => setScreen('moodboard')} />;
      case 'moodboard':
        return <MoodboardScreen chosenMood={chosenMood} onReset={handleReset} onBack={goBack} />;
      default:
        return null;
    }
  };

  return (
    <div style={{
      transform: `scale(${scale})`,
      transformOrigin: 'center center',
    }}>
      <div className="tablet-shell">
        <div className="tablet-screen">
          {renderScreen()}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
